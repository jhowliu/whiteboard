setup:
  - npm ci
verify:
  - npm run lint
  - npm run typecheck
  - npm test
  - npm run build
  - CI=1 npm run e2e
reports:
  evidence:
    - test-results/**/*.png
    - test-results/**/*.webm
runtime:
  dockerfile: .agent-cage/Dockerfile
agent:
  implement:
    provider: claude
    model: claude-sonnet-5-5
  review:
    provider: codex
    model: gpt-6-luna
  max_iterations: 5
  max_review_cycles: 2
git:
  base: main
  author_name: Agent Cage
  author_email: agent-cage@users.noreply.github.com
guards:
  max_secret_fix_attempts: 2
  red_green:
    test_files:
      - "**/*.{test,spec}.{js,jsx,ts,tsx,mjs,cjs,mts,cts}"
    support_files: []
    run: node scripts/test-file.mjs {file}
execution: docker
actions:
  enabled: false
  workflow: .github/workflows/agent-cage.yml
  agent_cage_version: null
  runner: ubuntu-latest
  timeout_minutes: 90
  container: null
  services: {}
  labels:
    run: agent-cage:run
    in_progress: agent-cage:in-progress
    ready: agent-cage:ready-for-review
    blocked: agent-cage:blocked
